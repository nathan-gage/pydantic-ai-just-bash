[project]
name = "pydantic-ai-just-bash"
version = "0.1.0"
description = "Pydantic AI capability and toolset for just-py-bash"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Nathan Gage", email = "contact@nathangage.co" }
]
requires-python = ">=3.11"
dependencies = [
    "just-py-bash>=2.14.1",
    "pydantic-ai-slim>=0.0.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
pydantic-ai-slim = { path = "../pydantic-ai-upstream/pydantic_ai_slim", editable = true }
just-py-bash = { path = "../just-py-bash/just_py_bash", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
