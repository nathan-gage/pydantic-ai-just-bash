[build-system]
requires = ["hatchling>=1.29.0", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-just-bash"
dynamic = ["version"]
description = "Persistent just-py-bash shell capability and toolset wrapper for Pydantic AI"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Nathan Gage", email = "contact@nathangage.co" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "agents",
  "bash",
  "capability",
  "just-bash",
  "llm",
  "pydantic-ai",
  "shell",
  "tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["just-py-bash>=2.14.2,<4", "pydantic-ai-slim>=1.71.0,<3"]

[project.urls]
Homepage = "https://github.com/nathan-gage/pydantic-ai-just-bash"
Source = "https://github.com/nathan-gage/pydantic-ai-just-bash"
Documentation = "https://github.com/nathan-gage/pydantic-ai-just-bash#readme"
Issues = "https://github.com/nathan-gage/pydantic-ai-just-bash/issues"
Changelog = "https://github.com/nathan-gage/pydantic-ai-just-bash/releases"

[project.optional-dependencies]
spec = ["pyyaml>=6.0.2", "pydantic-handlebars>=0.1.0"]

[dependency-groups]
dev = [
  "anyio>=4.0.0",
  "pytest>=8.0.0",
  "pyyaml>=6.0.2",
  "pydantic-handlebars>=0.1.0",
]
lint = [
  "mypy>=1.15.0",
  "pyright>=1.1.408",
  "ruff>=0.14.0",
  "taplo>=0.9.3",
  "types-PyYAML>=6.0.12.20250822",
  "yamlfix>=1.19.1",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = false
fallback-version = "0.1.0"
format-jinja = """
  {%- if base == '0.0.0' and distance > 0 -%}
    {{ serialize_pep440('0.1.0', stage, revision, dev=distance, metadata=[commit]) }}
  {%- elif distance == 0 -%}
    {{ serialize_pep440(base, stage, revision) }}
  {%- elif revision is not none -%}
    {{ serialize_pep440(base, stage, revision + 1, dev=distance, metadata=[commit]) }}
  {%- else -%}
    {{ serialize_pep440(bump_version(base), stage, revision, dev=distance, metadata=[commit]) }}
  {%- endif -%}
"""

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_just_bash"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/ROADMAP.md",
  "/LICENSE",
  "/Makefile",
  "/pyproject.toml",
]

[tool.uv]
default-groups = ["dev", "lint"]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "uv.lock" },
  { git = { commit = true, tags = true } },
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["B", "I", "Q", "RUF100", "UP"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.format]
docstring-code-format = false
quote-style = "single"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportUnnecessaryTypeIgnoreComment = true
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
executionEnvironments = [
  { root = ".", extraPaths = [
    "src",
  ] },
  { root = "tests", extraPaths = [
    "src",
  ], reportPrivateImportUsage = false },
]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
strict = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.yamlfix]
explicit_start = false
preserve_quotes = true
sequence_style = "keep_style"
line_length = 120
section_whitelines = 1
whitelines = 1
