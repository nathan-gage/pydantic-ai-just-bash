[build-system]
requires = ["hatchling>=1.29.0", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-just-bash"
dynamic = ["version"]
description = "Persistent just-py-bash shell capability and toolset wrapper for Pydantic AI"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Nathan Gage", email = "contact@nathangage.co" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
  "agents",
  "bash",
  "capability",
  "just-bash",
  "llm",
  "pydantic-ai",
  "shell",
  "tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pydantic",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "just-py-bash>=2.14.1,<3",
  "pydantic-ai-slim>=0.0.56,<0.1.0",
]

[project.urls]
Homepage = "https://github.com/nathan-gage/pydantic-ai-just-bash"
Source = "https://github.com/nathan-gage/pydantic-ai-just-bash"
Documentation = "https://github.com/nathan-gage/pydantic-ai-just-bash#readme"
Issues = "https://github.com/nathan-gage/pydantic-ai-just-bash/issues"
Changelog = "https://github.com/nathan-gage/pydantic-ai-just-bash/releases"

[dependency-groups]
dev = [
  "anyio>=4.0.0",
  "pytest>=8.0.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = false
fallback-version = "0.1.0"
format-jinja = """
  {%- if base == '0.0.0' and distance > 0 -%}
    {{ serialize_pep440('0.1.0', stage, revision, dev=distance, metadata=[commit]) }}
  {%- elif distance == 0 -%}
    {{ serialize_pep440(base, stage, revision) }}
  {%- elif revision is not none -%}
    {{ serialize_pep440(base, stage, revision + 1, dev=distance, metadata=[commit]) }}
  {%- else -%}
    {{ serialize_pep440(bump_version(base), stage, revision, dev=distance, metadata=[commit]) }}
  {%- endif -%}
"""

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_just_bash"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/ROADMAP.md", "/LICENSE", "/pyproject.toml"]

[tool.uv]
default-groups = ["dev"]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]

[tool.uv.sources]
pydantic-ai-slim = { path = "../pydantic-ai-upstream/pydantic_ai_slim", editable = true }
just-py-bash = { path = "../just-py-bash/just_py_bash", editable = true }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
xfail_strict = true
